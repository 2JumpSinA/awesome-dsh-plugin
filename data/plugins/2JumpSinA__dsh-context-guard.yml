url: https://github.com/2JumpSinA/dsh-context-guard
name: 2JumpSinA/dsh-context-guard
category: session
description:
  en: 'A ctx badge in the session header; hover to see where the number comes from: window, output reserve, provider/model, compaction point and its source. From 45% it silently drafts a handover into your working directory, and warns exactly once at 60%. The moment the platform compacts, it saves the pre-compaction reading as a ledger row (idempotent by compactionId). The draft holds machine facts only — session id, occupancy, spend, changed files with added/removed lines — verified at write time, so it stays faithful without calling a model. Registers no tool, injects no prompt, adds no cost.'
  zh: '会话头一个 ctx 角标，悬停能看到这个数怎么来的：窗口、输出预留、provider/model、压缩点与来源。45% 起静默往工作目录写交接草稿，60% 才提醒一次；压缩那刻抢存一行压缩前读数，按 compactionId 幂等。草稿只写机器事实：会话 id、占用、花费、改过文件的增删行，写盘时顺手核一遍文件在不在，所以零 LLM 也不失真。它不注册工具、不注入 prompt，不给你添成本。'
